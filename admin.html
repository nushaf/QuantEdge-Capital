<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox - QuantEdge Capital Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-dark text-white font-sans bg-mesh overflow-x-hidden min-h-screen flex flex-col">

    <nav class="fixed w-full z-50 glass border-b border-gray-800" id="navbar">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <span class="w-8 h-8 rounded-lg bg-neonBlue shadow-[0_0_15px_rgba(0,243,255,0.5)] flex items-center justify-center text-darker font-bold pr-1 text-xl">Q</span>
                <span class="font-display font-bold text-2xl tracking-tight">QuantEdge<span class="text-neonBlue">.</span> <span class="text-neonGreen text-sm align-top">Admin</span></span>
            </a>
            <button onclick="handleLogout()" class="text-gray-300 hover:text-neonRed font-medium text-sm px-4 py-2 transition-colors">Log Out</button>
        </div>
    </nav>

    <!-- Access gate shown until we confirm this is the admin -->
    <div id="access-check" class="flex-1 mt-20 flex items-center justify-center">
        <p class="text-gray-400 animate-pulse">Checking access...</p>
    </div>

    <!-- Inbox (hidden until access confirmed) -->
    <main id="inbox-main" class="hidden flex-1 mt-20 pt-16 pb-24 max-w-4xl mx-auto px-6 w-full">
        <div class="mb-12 reveal">
            <h1 class="text-4xl md:text-5xl font-display font-bold mb-3 text-glow-blue">Client Inbox</h1>
            <p class="text-gray-400">Messages from your contact form appear here in real time.</p>
        </div>

        <div id="messages-list" class="space-y-6">
            <!-- Messages injected here -->
        </div>

        <p id="empty-state" class="text-gray-500 text-center py-16 hidden">No messages yet. New client messages will show up here automatically.</p>
    </main>

    <script src="js/main.js"></script>
    <script type="module" src="js/admin.js"></script>
</body>
</html>
