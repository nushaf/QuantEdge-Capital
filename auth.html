<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantEdge Capital - Auth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-dark text-white font-sans min-h-screen flex items-center justify-center p-4 bg-mesh">

    <div class="glass-panel w-full max-w-xl rounded-2xl p-8 relative overflow-hidden reveal">
        <!-- Logo -->
        <div class="text-center mb-8">
            <h1 class="font-display font-bold text-3xl tracking-tight text-white flex items-center justify-center gap-2">
                <span class="w-8 h-8 rounded-lg bg-neonBlue shadow-[0_0_15px_rgba(0,243,255,0.5)] flex items-center justify-center text-darker font-bold">Q</span>
                QuantEdge<span class="text-neonBlue">.</span>
            </h1>
            <h2 id="auth-title" class="text-2xl font-bold mt-4 outfit text-glow-blue">Create Account</h2>
        </div>

        <form id="register-form" onsubmit="submitForm(event)">
            <!-- Step 1 -->
            <div class="auth-step space-y-4" id="step-1">
                <input type="email" required class="w-full px-4 py-3 rounded-xl" placeholder="Email Address">
                <div class="relative">
                    <input id="register-password" type="password" required autocomplete="new-password" class="w-full px-4 py-3 pr-12 rounded-xl" placeholder="Password">
                    <button type="button" onclick="toggleRegisterPasswordVisibility()" id="register-password-eye" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </button>
                </div>
                <button type="button" onclick="nextStep()" class="w-full bg-neonBlue text-darker font-bold py-3 rounded-xl">Continue</button>
            </div>
            <!-- Step 2 -->
            <div class="auth-step space-y-4 hidden" id="step-2">
                <input type="text" required class="w-full px-4 py-3 rounded-xl" placeholder="Full Name">
                <input type="tel" required class="w-full px-4 py-3 rounded-xl" placeholder="Phone Number">
                <div class="flex gap-4">
                    <button type="button" onclick="prevStep()" class="w-1/3 bg-transparent border border-gray-600 rounded-xl">Back</button>
                    <button type="button" onclick="nextStep()" class="w-2/3 bg-neonBlue text-darker font-bold py-3 rounded-xl">Continue</button>
                </div>
            </div>
            <!-- Step 3 -->
            <div class="auth-step hidden" id="step-3">
                <div class="border-2 border-dashed border-gray-600 rounded-xl p-8 text-center file-upload-wrapper w-full mb-4">
                    <input type="file" onchange="showToast('ID Uploaded', 'success')">
                    <p class="text-gray-400">Upload ID</p>
                </div>
                <div class="flex gap-4">
                    <button type="button" onclick="prevStep()" class="w-1/3 bg-transparent border border-gray-600 rounded-xl">Back</button>
                    <button type="button" onclick="nextStep()" class="w-2/3 bg-neonBlue text-darker font-bold py-3 rounded-xl">Skip & Continue</button>
                </div>
            </div>
            <!-- Step 4 -->
            <div class="auth-step hidden" id="step-4">
                <div class="mb-4 space-y-2">
                    <label class="block border border-gray-600 p-4 rounded-xl cursor-pointer hover:border-neonGreen"><input type="radio" name="dep" checked> Credit Card</label>
                    <label class="block border border-gray-600 p-4 rounded-xl cursor-pointer hover:border-neonGold"><input type="radio" name="dep"> Crypto</label>
                </div>
                <div class="flex gap-4">
                    <button type="button" onclick="prevStep()" class="w-1/3 bg-transparent border border-gray-600 rounded-xl">Back</button>
                    <button type="submit" class="w-2/3 bg-neonBlue text-darker font-bold py-3 rounded-xl">Finish</button>
                </div>
            </div>
            <p class="text-center mt-6 text-sm text-gray-400">Have an account? <span onclick="toggleMode()" class="text-neonBlue cursor-pointer">Log In</span></p>
        </form>

        <form id="login-form" class="hidden" onsubmit="login(event)">
            <div class="space-y-4">
                <input id="login-email" type="email" required autocomplete="username" class="w-full px-4 py-3 rounded-xl" placeholder="Email">
                <div class="relative">
                    <input id="login-password" type="password" required autocomplete="current-password" class="w-full px-4 py-3 pr-12 rounded-xl" placeholder="Password">
                    <button type="button" onclick="toggleLoginPasswordVisibility()" id="login-password-eye" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </button>
                </div>
                <div class="flex items-center justify-between">
                    <label class="flex items-center gap-2 text-sm text-gray-400 cursor-pointer">
                        <input id="remember-me" type="checkbox" class="rounded border-gray-600 bg-transparent text-neonBlue focus:ring-neonBlue">
                        Remember me
                    </label>
                    <p class="text-sm text-neonBlue hover:underline cursor-pointer" onclick="forgotPassword()">Forgot password?</p>
                </div>
                <button type="submit" class="w-full bg-neonBlue text-darker font-bold py-3 rounded-xl">Sign In</button>
            </div>
            <p class="text-center mt-6 text-sm text-gray-400">Need an account? <span onclick="toggleMode()" class="text-neonBlue cursor-pointer">Sign Up</span></p>
        </form>
    </div>

    <script src="js/main.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
