<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantEdge Capital - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-darker text-white font-sans flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-darkCard border-r border-gray-800 flex flex-col transition-all duration-300 relative z-20">
        <div class="p-6 border-b border-gray-800 flex items-center justify-between">
            <h1 class="font-display font-bold text-xl tracking-tight text-white flex items-center gap-2" id="sidebar-logo-text">
                <span class="w-8 h-8 rounded-lg bg-neonBlue shadow-[0_0_10px_rgba(0,243,255,0.5)] flex items-center justify-center text-darker font-bold">Q</span>
                QuantEdge<span class="text-neonBlue">.</span>
            </h1>
            <button id="toggle-sidebar" class="text-gray-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </div>
        
        <nav class="flex-1 overflow-y-auto py-4 custom-scrollbar">
            <ul class="space-y-1 px-3" id="nav-links">
                <!-- Links injected by JS -->
            </ul>
        </nav>
        
        <div class="p-4 border-t border-gray-800">
            <div class="flex items-center gap-3 glass p-3 rounded-xl cursor-pointer hover:bg-gray-800 transition-colors">
                <div class="w-10 h-10 rounded-full bg-gradient-primary flex items-center justify-center font-bold text-darker">JD</div>
                <div class="sidebar-text">
                    <p class="text-sm font-bold text-white">John Doe</p>
                    <p class="text-xs text-gray-400">Pro Trader</p>
                </div>
            </div>
            <button onclick="logout()" class="mt-3 w-full flex items-center gap-3 px-4 py-2 text-sm text-neonRed hover:bg-[rgba(255,51,102,0.1)] rounded-lg transition-colors sidebar-text">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col bg-mesh-dark relative h-full overflow-hidden">
        
        <!-- Topheader -->
        <header class="h-16 border-b border-gray-800 glass-panel flex items-center justify-between px-6 z-10">
            <h2 id="page-title" class="text-xl font-display font-bold text-glow-blue">Dashboard</h2>
            
            <div class="flex items-center gap-4">
                <p class="text-sm bg-gray-800 px-3 py-1 rounded-full text-neonGreen font-mono"><span class="w-2 h-2 rounded-full bg-neonGreen inline-block mr-2 animate-pulse"></span>Live Market</p>
                <div class="relative cursor-pointer hover:text-neonBlue transition-colors group">
                    <svg class="w-6 h-6 text-gray-400 group-hover:text-neonBlue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                    <span class="absolute top-0 right-0 w-2 h-2 rounded-full bg-neonRed"></span>
                </div>
            </div>
        </header>

        <!-- Page Content Area -->
        <div id="content-area" class="flex-1 overflow-y-auto p-6 md:p-8 custom-scrollbar">
            <!-- Dynamic Content Injected Here -->
        </div>
    </main>

    <!-- Loading Overlay -->
    <div id="loader" class="fixed inset-0 bg-darker z-50 flex items-center justify-center transition-opacity duration-500">
        <div class="flex flex-col items-center">
            <div class="w-16 h-16 border-4 border-gray-800 border-t-neonBlue rounded-full animate-spin mb-4 shadow-[0_0_15px_#00f3ff]"></div>
            <p class="text-neonBlue outfit font-bold animate-pulse">Loading Platform...</p>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
