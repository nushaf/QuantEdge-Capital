<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantEdge Capital - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-darker text-white font-sans flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-darkCard border-r border-gray-800 flex flex-col transition-all duration-300 relative z-20">
        <div class="p-6 border-b border-gray-800 flex items-center justify-between">
            <h1 class="font-display font-bold text-xl tracking-tight text-white flex items-center gap-2" id="sidebar-logo-text">
                <span class="w-8 h-8 rounded-lg bg-neonBlue shadow-[0_0_10px_rgba(0,243,255,0.5)] flex items-center justify-center text-darker font-bold">Q</span>
                QuantEdge<span class="text-neonBlue">.</span>
            </h1>
            <button id="toggle-sidebar" class="text-gray-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </div>
        
        <nav class="flex-1 overflow-y-auto py-4 custom-scrollbar">
            <ul class="space-y-1 px-3" id="nav-links">
                <!-- Links injected by JS -->
            </ul>
        </nav>
        
        <div class="p-4 border-t border-gray-800">
            <div class="flex items-center gap-3 glass p-3 rounded-xl cursor-pointer hover:bg-gray-800 transition-colors">
                <div class="w-10 h-10 rounded-full bg-gradient-primary flex items-center justify-center font-bold text-darker">JD</div>
                <div class="sidebar-text">
                    <p class="text-sm font-bold text-white">John Doe</p>
                    <p class="text-xs text-gray-400">Pro Trader</p>
                </div>
            </div>
            <button onclick="logout()" class="mt-3 w-full flex items-center gap-3 px-4 py-2 text-sm text-neonRed hover:bg-[rgba(255,51,102,0.1)] rounded-lg transition-colors sidebar-text">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col bg-mesh-dark relative h-full overflow-hidden">
        
        <!-- Topheader -->
        <header class="h-16 border-b border-gray-800 glass-panel flex items-center justify-between px-6 z-10">
            <h2 id="page-title" class="text-xl font-display font-bold text-glow-blue">Dashboard</h2>
            
            <div class="flex items-center gap-4">
                <p class="text-sm bg-gray-800 px-3 py-1 rounded-full text-neonGreen font-mono"><span class="w-2 h-2 rounded-full bg-neonGreen inline-block mr-2 animate-pulse"></span>Live Market</p>
                <div class="relative cursor-pointer hover:text-neonBlue transition-colors group">
                    <svg class="w-6 h-6 text-gray-400 group-hover:text-neonBlue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                    <span class="absolute top-0 right-0 w-2 h-2 rounded-full bg-neonRed"></span>
                </div>
            </div>
        </header>

        <!-- Page Content Area -->
        <div id="content-area" class="flex-1 overflow-y-auto p-6 md:p-8 custom-scrollbar">
            <!-- Dynamic Content Injected Here -->
        </div>
    </main>

    <!-- Loading Overlay -->
    <div id="loader" class="fixed inset-0 bg-darker z-50 flex items-center justify-center transition-opacity duration-500">
        <div class="flex flex-col items-center">
            <div class="w-16 h-16 border-4 border-gray-800 border-t-neonBlue rounded-full animate-spin mb-4 shadow-[0_0_15px_#00f3ff]"></div>
            <p class="text-neonBlue outfit font-bold animate-pulse">Loading Platform...</p>
        </div>
    </div>

    <!-- Deposit Modal -->
    <div id="deposit-modal" class="hidden fixed inset-0 bg-black/70 z-[60] flex items-center justify-center p-4">
        <div class="glass-panel p-8 rounded-2xl w-full max-w-md max-h-[90vh] overflow-y-auto custom-scrollbar">
            <div class="flex items-center justify-between mb-6">
                <h3 class="font-display font-bold text-xl">Deposit Funds</h3>
                <button onclick="closeDepositModal()" class="text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Step 1: Amount -->
            <div id="deposit-step-1" class="deposit-step">
                <label class="block text-sm text-gray-400 mb-2">Enter Amount ($)</label>
                <input id="deposit-amount" type="number" step="0.01" min="1" placeholder="e.g. 500" class="w-full px-4 py-3 rounded-xl border border-gray-700 bg-[rgba(255,255,255,0.03)] focus:border-neonBlue outline-none mb-6">
                <button onclick="depositNext(1)" class="w-full bg-neonBlue text-darker font-bold py-3 rounded-xl hover:shadow-[0_0_15px_rgba(0,243,255,0.4)] transition-all">Continue</button>
            </div>

            <!-- Step 2: Choose method -->
            <div id="deposit-step-2" class="deposit-step hidden">
                <p class="text-gray-400 text-sm mb-4">Choose your payment method</p>
                <div class="space-y-3 mb-6">
                    <button onclick="chooseDepositMethod('wallet')" class="w-full text-left p-4 rounded-xl border border-gray-700 hover:border-neonBlue transition-all flex items-center gap-3">
                        <svg class="w-6 h-6 text-neonBlue flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                        <div><p class="font-bold">Crypto Wallet</p><p class="text-xs text-gray-500">Pay with crypto</p></div>
                    </button>
                    <button onclick="chooseDepositMethod('bank')" class="w-full text-left p-4 rounded-xl border border-gray-700 hover:border-neonBlue transition-all flex items-center gap-3">
                        <svg class="w-6 h-6 text-neonBlue flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21h18M4 10h16M5 6l7-3 7 3M4 10v11m16-11v11M9 14v3m6-3v3"></path></svg>
                        <div><p class="font-bold">Bank Transfer</p><p class="text-xs text-gray-500">Direct bank deposit</p></div>
                    </button>
                </div>
                <button onclick="depositBack(2)" class="w-full text-gray-400 text-sm hover:text-white">Back</button>
            </div>

            <!-- Step 3: Show details -->
            <div id="deposit-step-3" class="deposit-step hidden">
                <div id="deposit-details-box" class="space-y-3 mb-6"></div>
                <button onclick="depositNext(3)" class="w-full bg-neonBlue text-darker font-bold py-3 rounded-xl hover:shadow-[0_0_15px_rgba(0,243,255,0.4)] transition-all mb-3">I've Made the Payment</button>
                <button onclick="depositBack(3)" class="w-full text-gray-400 text-sm hover:text-white">Back</button>
            </div>

            <!-- Step 4: Upload proof -->
            <div id="deposit-step-4" class="deposit-step hidden">
                <p class="text-gray-400 text-sm mb-4">Upload a screenshot of your payment as proof — we'll verify it and credit your account.</p>
                <input id="deposit-proof-input" type="file" accept="image/*" capture="environment" class="w-full text-sm text-gray-400 mb-4 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-neonBlue file:text-darker file:font-bold hover:file:bg-opacity-80 file:cursor-pointer cursor-pointer">
                <img id="deposit-proof-preview" class="hidden w-full rounded-xl mb-4 max-h-48 object-contain bg-black/30">
                <button id="deposit-submit-btn" onclick="submitDeposit()" class="w-full bg-neonBlue text-darker font-bold py-3 rounded-xl hover:shadow-[0_0_15px_rgba(0,243,255,0.4)] transition-all mb-3">Submit for Verification</button>
                <button onclick="depositBack(4)" class="w-full text-gray-400 text-sm hover:text-white">Back</button>
            </div>
        </div>
    </div>

    <!-- Withdraw Modal -->
    <div id="withdraw-modal" class="hidden fixed inset-0 bg-black/70 z-[60] flex items-center justify-center p-4">
        <div class="glass-panel p-8 rounded-2xl w-full max-w-md max-h-[90vh] overflow-y-auto custom-scrollbar">
            <div class="flex items-center justify-between mb-6">
                <h3 class="font-display font-bold text-xl">Withdraw Funds</h3>
                <button onclick="closeWithdrawModal()" class="text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Step 1: Amount + method -->
            <div id="withdraw-step-1" class="withdraw-step">
                <label class="block text-sm text-gray-400 mb-2">Enter Amount ($)</label>
                <input id="withdraw-amount" type="number" step="0.01" min="1" placeholder="e.g. 500" class="w-full px-4 py-3 rounded-xl border border-gray-700 bg-[rgba(255,255,255,0.03)] focus:border-neonBlue outline-none mb-6">
                <p class="text-gray-400 text-sm mb-4">Where should we send it?</p>
                <div class="space-y-3 mb-6">
                    <button onclick="chooseWithdrawMethod('wallet')" class="w-full text-left p-4 rounded-xl border border-gray-700 hover:border-neonBlue transition-all flex items-center gap-3">
                        <svg class="w-6 h-6 text-neonBlue flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                        <div><p class="font-bold">Crypto Wallet</p><p class="text-xs text-gray-500">Send to my wallet address</p></div>
                    </button>
                    <button onclick="chooseWithdrawMethod('bank')" class="w-full text-left p-4 rounded-xl border border-gray-700 hover:border-neonBlue transition-all flex items-center gap-3">
                        <svg class="w-6 h-6 text-neonBlue flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21h18M4 10h16M5 6l7-3 7 3M4 10v11m16-11v11M9 14v3m6-3v3"></path></svg>
                        <div><p class="font-bold">Bank Transfer</p><p class="text-xs text-gray-500">Send to my bank account</p></div>
                    </button>
                </div>
            </div>

            <!-- Step 2: Destination details -->
            <div id="withdraw-step-2" class="withdraw-step hidden">
                <div id="withdraw-wallet-fields" class="hidden mb-4">
                    <label class="block text-sm text-gray-400 mb-2">Your Wallet Address</label>
                    <input id="withdraw-wallet-address" type="text" placeholder="Paste your wallet address" class="w-full px-4 py-3 rounded-xl border border-gray-700 bg-[rgba(255,255,255,0.03)] focus:border-neonBlue outline-none">
                </div>
                <div id="withdraw-bank-fields" class="hidden space-y-3 mb-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Account Holder Name</label>
                        <input id="withdraw-bank-name-holder" type="text" class="w-full px-4 py-3 rounded-xl border border-gray-700 bg-[rgba(255,255,255,0.03)] focus:border-neonBlue outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Bank Name</label>
                        <input id="withdraw-bank-name" type="text" class="w-full px-4 py-3 rounded-xl border border-gray-700 bg-[rgba(255,255,255,0.03)] focus:border-neonBlue outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Account Number / IBAN</label>
                        <input id="withdraw-bank-account" type="text" class="w-full px-4 py-3 rounded-xl border border-gray-700 bg-[rgba(255,255,255,0.03)] focus:border-neonBlue outline-none">
                    </div>
                </div>
                <button id="withdraw-submit-btn" onclick="submitWithdrawal()" class="w-full bg-neonBlue text-darker font-bold py-3 rounded-xl hover:shadow-[0_0_15px_rgba(0,243,255,0.4)] transition-all mb-3">Submit Withdrawal Request</button>
                <button onclick="withdrawBack()" class="w-full text-gray-400 text-sm hover:text-white">Back</button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
